services:
  secure-vault-web:
    container_name: secure-vault-x-app

    image: kamikaza21/secure-vault-x-nextjs:v1.0.2

    build:
      context: .
      dockerfile: apps/web/Dockerfile
      platforms:
        - linux/amd64

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - apps/web/.env

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    init: true
    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
